<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEET 26 Daily Tracker</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fb;color:#172033}.app{max-width:1100px;margin:auto;padding:22px 16px 40px}.auth{max-width:430px;margin:70px auto;background:#fff;border:1px solid #e0e4ec;border-radius:16px;padding:24px}.hidden{display:none!important}h1{margin:0;font-size:28px}.sub,.muted{color:#667085}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}button,input{font:inherit}button,input[type=date],input[type=email],input[type=password]{border:1px solid #d6dce7;background:#fff;border-radius:10px;padding:10px 12px;min-height:42px}button{cursor:pointer}.primary{background:#3159b7;color:#fff;border-color:#3159b7}.auth input{width:100%;margin:6px 0}.auth button{width:100%;margin-top:8px}.msg{font-size:13px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card{background:#fff;border:1px solid #e0e4ec;border-radius:14px;padding:14px}.big{font-size:22px;font-weight:700;margin-top:3px}.progress{height:9px;background:#e8ebf1;border-radius:99px;margin-top:9px;overflow:hidden}.fill{height:100%;background:#3159b7;width:0}.panel,.calendar{background:#fff;border:1px solid #e0e4ec;border-radius:14px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid #e8ebf1;min-height:52px}.row.done{background:#eef8f1}.row input{width:21px;height:21px;accent-color:#3159b7}.task.done{text-decoration:line-through;color:#667085}.calendar{margin-top:20px;padding:15px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:#667085;padding:5px}.day{border:1px solid #e2e6ee;border-radius:7px;min-height:42px;background:#fff;cursor:pointer}.day.done{background:#dff2e5;border-color:#9ed2ad}.day.partial{background:#fff5d8;border-color:#ead27c}.day.selected{outline:2px solid #3159b7}.day.empty{border:0;background:transparent}.footer{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#667085}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}</style></head>
<body>
<div id="auth" class="auth"><h2>NEET 26 Tracker</h2><p class="muted">Your checklist syncs online across devices.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><button id="signup" class="primary">Create account</button><button id="signin">Sign in</button><div id="authMsg" class="msg"></div></div>
<div id="app" class="app hidden"><header style="display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap"><div><h1>NEET 26 • Daily Tracker</h1><div class="sub">September 1, 2026 → April 30, 2027</div></div><div><span id="userEmail" class="muted"></span> <button id="logout">Log out</button></div></header>
<div class="controls"><button id="prev">←</button><input id="date" type="date" min="2026-09-01" max="2027-04-30"><button id="next">→</button></div>
<div class="stats"><div class="card"><div class="muted">Selected day</div><div class="big" id="dayName">—</div></div><div class="card"><div class="muted">Completed</div><div class="big" id="done">0 / 13</div></div><div class="card"><div class="muted">Completion</div><div class="big" id="pct">0%</div></div><div class="card"><div class="muted">Days with progress</div><div class="big" id="overall">0 / 242</div><div class="progress"><div id="fill" class="fill"></div></div></div></div>
<div id="tasks" class="panel"></div><div class="calendar"><div class="calhead"><strong id="monthTitle"></strong><div><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div><div id="calendar" class="grid"></div></div><div class="footer"><span id="saveStatus">Not connected</span><button id="reset">Reset selected day</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const TASKS=["Wake on time","Morning revision","Allen class attended properly","Physics same-day revision","Chemistry same-day revision","Biology NCERT","Biology questions","Physics questions","Chemistry questions","Error book updated","Light revision","No Instagram / endless scrolling","Sleep on time"];
const MIN="2026-09-01",MAX="2027-04-30";
const SUPABASE_URL="https://dmrgvhfvnxbcrvvqidfa.supabase.co",SUPABASE_ANON_KEY="sb_publishable_qTNwWRR7wObbS4e_vcheaA_4_4oGgc-";
const configured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_ANON_KEY.startsWith("PASTE_");const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id),date=$("date");let records={},user=null;
let now=new Date(),initial=now.toISOString().slice(0,10);if(initial<MIN)initial=MIN;if(initial>MAX)initial=MAX;date.value=initial;
let monthCursor=new Date(Date.UTC(2026,8,1));
const iso=x=>x.toISOString().slice(0,10), valid=d=>d>=MIN&&d<=MAX;
function fmt(d){let[y,m,day]=d.split("-").map(Number);return new Intl.DateTimeFormat("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,day)))}
function shift(d,n){let[y,m,day]=d.split("-").map(Number),x=new Date(Date.UTC(y,m-1,day));x.setUTCDate(x.getUTCDate()+n);return iso(x)}
function state(d){return records[d]||Array(13).fill(false)}
async function load(){let{data,error}=await sb.from("daily_checklist").select("date,checks").eq("user_id",user.id);if(error){$("saveStatus").textContent="Sync error";return}records={};(data||[]).forEach(r=>records[r.date]=r.checks)}
async function save(d,s){records[d]=s;$("saveStatus").textContent="Saving…";let{error}=await sb.from("daily_checklist").upsert({user_id:user.id,date:d,checks:s},{onConflict:"user_id,date"});$("saveStatus").textContent=error?"Sync error":"Saved online ✓";render()}
function render(){let d=date.value,s=state(d),n=s.filter(Boolean).length,p=Math.round(n/13*100);$("dayName").textContent=fmt(d);$("done").textContent=n+" / 13";$("pct").textContent=p+"%";let tracked=Object.keys(records).filter(k=>valid(k)&&state(k).some(Boolean)).length;$("overall").textContent=tracked+" / 242";$("fill").style.width=Math.round(tracked/242*100)+"%";$("tasks").innerHTML="";TASKS.forEach((t,i)=>{let row=document.createElement("label");row.className="row"+(s[i]?" done":"");let cb=document.createElement("input");cb.type="checkbox";cb.checked=!!s[i];let sp=document.createElement("span");sp.className="task"+(s[i]?" done":"");sp.textContent=t;cb.onchange=()=>{s[i]=cb.checked;save(d,s)};row.append(cb,sp);$("tasks").append(row)});renderCalendar()}
function renderCalendar(){let y=monthCursor.getUTCFullYear(),m=monthCursor.getUTCMonth();$("monthTitle").textContent=new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m,1)));let g=$("calendar");g.innerHTML="";["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>{let e=document.createElement("div");e.className="dow";e.textContent=x;g.append(e)});let first=new Date(Date.UTC(y,m,1)).getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate();for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";g.append(e)}for(let day=1;day<=days;day++){let d=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`,n=state(d).filter(Boolean).length,e=document.createElement("button");e.className="day"+(n===13?" done":n?" partial":"")+(d===date.value?" selected":"");e.textContent=day;e.disabled=!valid(d);e.onclick=()=>{date.value=d;render()};g.append(e)}}
async function start(session){user=session?.user||null;if(!user){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=user.email||"";await load();render()}
$("signup").onclick=async()=>{if(!configured){$("authMsg").textContent="Supabase is not configured yet. Follow SETUP.txt.";return}let{data,error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});$("authMsg").textContent=error?error.message:(data.session?"Account created.":"Account created — check your email, then sign in.")};
$("signin").onclick=async()=>{if(!configured){$("authMsg").textContent="Supabase is not configured yet. Follow SETUP.txt.";return}let{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("authMsg").textContent=error?error.message:"Signed in."};
$("logout").onclick=()=>sb.auth.signOut().then(()=>location.reload());$("prev").onclick=()=>{let n=shift(date.value,-1);if(valid(n)){date.value=n;render()}};$("next").onclick=()=>{let n=shift(date.value,1);if(valid(n)){date.value=n;render()}};date.onchange=render;$("reset").onclick=()=>save(date.value,Array(13).fill(false));$("prevMonth").onclick=()=>{monthCursor.setUTCMonth(monthCursor.getUTCMonth()-1);renderCalendar()};$("nextMonth").onclick=()=>{monthCursor.setUTCMonth(monthCursor.getUTCMonth()+1);renderCalendar()};
if(configured){sb.auth.getSession().then(({data})=>start(data.session));sb.auth.onAuthStateChange((_e,s)=>start(s))}else{$("authMsg").textContent="Next: connect Supabase, then publish this page."}
</script></body></html>
